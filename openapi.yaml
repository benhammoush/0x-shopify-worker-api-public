openapi: 3.1.0
info:
  title: 0x Shopify Worker API
  version: 0.4.0
  description: Testnet-only portfolio API. It is not a Shopify-approved payment integration.
paths:
  /health:
    get:
      responses:
        '200': { description: Worker is running }
  /ready:
    get:
      responses:
        '200': { description: Shopify configuration status }
  /v1/status:
    get:
      responses:
        '200': { description: API and crypto-demo status }
  /v1/products:
    get:
      responses:
        '200': { description: Shopify catalog products }
        '503': { description: Shopify is not configured }
        '502': { description: Shopify is unavailable }
  /v1/carts:
    post:
      description: Creates a Shopify cart from validated product-variant lines.
      responses:
        '200': { description: Shopify cart and development-store checkout URL }
        '400': { description: Invalid cart line request }
        '422': { description: Shopify rejected the cart }
  /v1/carts/{cartId}:
    get:
      parameters:
        - in: path
          name: cartId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Shopify cart }
        '404': { description: Cart not found }
  /v1/carts/{cartId}/lines:
    post:
      parameters:
        - in: path
          name: cartId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Updated Shopify cart }
  /v1/carts/{cartId}/lines/{lineId}:
    post:
      parameters:
        - in: path
          name: cartId
          required: true
          schema: { type: string }
        - in: path
          name: lineId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Updated Shopify cart }
  /v1/carts/{cartId}/delivery-address:
    post:
      description: Replaces the one-time delivery address used by Shopify to calculate delivery options and totals.
      parameters:
        - in: path
          name: cartId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Cart with Shopify delivery groups }
        '400': { description: Invalid delivery address }
  /v1/carts/{cartId}/delivery-options:
    post:
      description: Selects a Shopify delivery option for each returned delivery group.
      parameters:
        - in: path
          name: cartId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Cart with updated Shopify total }
  /v1/crypto/{resource}:
    get:
      parameters:
        - in: path
          name: resource
          required: true
          schema: { type: string }
      responses:
        '503': { description: Crypto is intentionally disabled pending approved testnet rules }
  /v1/crypto/intents:
    post:
      description: Issues immutable Solana Devnet test-USDC terms from a delivery-ready Shopify cart.
      responses:
        '200': { description: Payment intent with exact raw USDC amount }
        '422': { description: Cart does not have a selected delivery option }
  /v1/crypto/intents/{intentId}/verify:
    post:
      description: Verifies a finalized Solana USDC transfer then creates a pending Shopify test order once.
      parameters:
        - in: path
          name: intentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Verification state or Verified testnet transfer }
        '409': { description: Transaction or intent was already claimed }
